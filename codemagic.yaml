workflows:
  ios-unsigned-check:
    name: iOS build check (unsigned)
    # Verifies the iOS side actually compiles on a real Mac, since that
    # can't be tested on Windows at all. Still unsigned — once code signing
    # (App Store Connect integration/certificates) is set up, switch to
    # `flutter build ipa` for a real submittable archive.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Add GEMINI_API_KEY as an encrypted environment variable in the
        # Codemagic UI (Workflow settings > Environment variables) — never
        # commit it here.
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Build iOS (unsigned)
        script: |
          cd app
          flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - app/build/ios/iphoneos/*.app

  ios-release:
    name: iOS release build (signed)
    # Signing files (certificate, provisioning profile, App Store Connect
    # API key) are committed encrypted at app/ios/signing/*.enc.
    # IOS_SIGNING_DECRYPT_PASSWORD and IOS_P12_PASSWORD live in the
    # "ios_signing" variable group in the Codemagic UI.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Decrypt and install signing files
        script: |
          cd app
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # Strip any accidental trailing whitespace/newline picked up when
          # the passphrase was copy-pasted into the Codemagic UI.
          TRIMMED_DECRYPT_PW=$(printf '%s' "$IOS_SIGNING_DECRYPT_PASSWORD" | tr -d '[:space:]')
          TRIMMED_P12_PW=$(printf '%s' "$IOS_P12_PASSWORD" | tr -d '[:space:]')
          # TEMPORARY DIAGNOSTIC — remove once decryption works. Expected:
          # length=24, sha256=5859203e4ff1eafcbfd3657d360f687648e9d42a7b7a2d003905ca013832b8b4
          # (expected bytes: 38 66 62 34 34 62 36 62 30 33 38 36 34 65 62 66 63 66 61 63 35 37 65 32)
          echo "IOS_SIGNING_DECRYPT_PASSWORD trimmed length: ${#TRIMMED_DECRYPT_PW}"
          printf '%s' "$TRIMMED_DECRYPT_PW" | openssl dgst -sha256
          printf '%s' "$TRIMMED_DECRYPT_PW" | od -c | head -5
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in ios/signing/distribution.p12.enc -out /tmp/distribution.p12 \
            -pass "pass:$TRIMMED_DECRYPT_PW"
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in ios/signing/Kairos_App_Store.mobileprovision.enc \
            -out "$HOME/Library/MobileDevice/Provisioning Profiles/Kairos_App_Store.mobileprovision" \
            -pass "pass:$TRIMMED_DECRYPT_PW"
          keychain initialize
          keychain add-certificates -c /tmp/distribution.p12 --certificate-password "$TRIMMED_P12_PW"
          xcode-project use-profiles --project=ios/Runner.xcodeproj --archive-method=app-store
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Build signed IPA
        script: |
          cd app
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - app/build/ios/ipa/*.ipa

  android-release:
    name: Android release build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      # The keystore itself is committed (encrypted) at
      # app/android/release-keystore.enc. CM_KEYSTORE_DECRYPT_PASSWORD,
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD live in the
      # "android_signing" variable group in the Codemagic UI — importing
      # the group (not a plain vars self-reference) is what actually
      # exposes them to this workflow.
      groups:
        - android_signing
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Set up Android release signing
        script: |
          cd app
          # Strip any accidental trailing whitespace/newline picked up when
          # the passphrase was copy-pasted into the Codemagic UI.
          TRIMMED_PASSWORD=$(printf '%s' "$CM_KEYSTORE_DECRYPT_PASSWORD" | tr -d '[:space:]')
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in android/release-keystore.enc \
            -out /tmp/kairos-release.keystore -pass "pass:$TRIMMED_PASSWORD"
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/kairos-release.keystore
          EOF
      - name: Build Android App Bundle
        script: |
          cd app
          flutter build appbundle --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - app/build/app/outputs/bundle/release/*.aab
