workflows:
  ios-screenshots:
    name: iOS App Store screenshots
    # Boots an iPhone 13 Pro Max simulator (6.5" — one of the accepted App
    # Store screenshot sizes) and drives the app with integration_test to
    # capture screenshots of the main tabs, logged into a dedicated seeded
    # test account. No code signing needed — simulator builds are unsigned.
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Boot an iOS Simulator
        script: |
          xcrun simctl list devices available
          UDID=""
          for NAME in "iPhone 15 Pro Max" "iPhone 14 Pro Max" "iPhone 13 Pro Max" "iPhone 11 Pro Max"; do
            FOUND=$(xcrun simctl list devices available | grep "$NAME (" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
            if [ -n "$FOUND" ]; then
              UDID="$FOUND"
              break
            fi
          done
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          fi
          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID"
          # Pre-grant notification permission so iOS's native system alert
          # never appears — that alert is outside the Flutter widget tree
          # and would otherwise block the whole automated test forever.
          xcrun simctl privacy "$UDID" grant notifications com.kairos.app.ios || true
          echo "SCREENSHOT_SIMULATOR_UDID=$UDID" >> "$CM_ENV"
      - name: Run screenshot capture
        script: |
          cd app
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            -d "$SCREENSHOT_SIMULATOR_UDID" \
            --dart-define=SCREENSHOT_ACCOUNT_PASSWORD="$SCREENSHOT_ACCOUNT_PASSWORD"
    artifacts:
      - app/build/*.png

  ios-unsigned-check:
    name: iOS build check (unsigned)
    # Verifies the iOS side actually compiles on a real Mac, since that
    # can't be tested on Windows at all. Still unsigned — once code signing
    # (App Store Connect integration/certificates) is set up, switch to
    # `flutter build ipa` for a real submittable archive.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Add GEMINI_API_KEY as an encrypted environment variable in the
        # Codemagic UI (Workflow settings > Environment variables) — never
        # commit it here.
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Build iOS (unsigned)
        script: |
          cd app
          flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - app/build/ios/iphoneos/*.app

  ios-release:
    name: iOS release build (signed)
    # Signing files (certificate, provisioning profile, App Store Connect
    # API key) are committed encrypted at app/ios/signing/*.enc.
    # IOS_SIGNING_DECRYPT_PASSWORD, IOS_P12_PASSWORD,
    # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER live in
    # the "ios_signing" variable group in the Codemagic UI.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Decrypt and install signing files
        script: |
          cd app
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # Strip any accidental trailing whitespace/newline picked up when
          # the passphrase was copy-pasted into the Codemagic UI.
          TRIMMED_DECRYPT_PW=$(printf '%s' "$IOS_SIGNING_DECRYPT_PASSWORD" | tr -d '[:space:]')
          TRIMMED_P12_PW=$(printf '%s' "$IOS_P12_PASSWORD" | tr -d '[:space:]')
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in ios/signing/distribution.p12.enc -out /tmp/distribution.p12 \
            -pass "pass:$TRIMMED_DECRYPT_PW"
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in ios/signing/Kairos_App_Store.mobileprovision.enc \
            -out "$HOME/Library/MobileDevice/Provisioning Profiles/Kairos_App_Store.mobileprovision" \
            -pass "pass:$TRIMMED_DECRYPT_PW"
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in ios/signing/AuthKey.p8.enc -out /tmp/AuthKey.p8 \
            -pass "pass:$TRIMMED_DECRYPT_PW"
          keychain initialize
          keychain add-certificates -c /tmp/distribution.p12 --certificate-password "$TRIMMED_P12_PW"
          xcode-project use-profiles --project=ios/Runner.xcodeproj --archive-method=app-store
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Build signed IPA
        script: |
          cd app
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
      - name: Publish to App Store Connect
        script: |
          cd app
          export APP_STORE_CONNECT_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/AuthKey.p8)"
          app-store-connect publish --path build/ios/ipa/*.ipa
    artifacts:
      - app/build/ios/ipa/*.ipa

  android-release:
    name: Android release build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      # The keystore itself is committed (encrypted) at
      # app/android/release-keystore.enc. CM_KEYSTORE_DECRYPT_PASSWORD,
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD live in the
      # "android_signing" variable group in the Codemagic UI — importing
      # the group (not a plain vars self-reference) is what actually
      # exposes them to this workflow.
      groups:
        - android_signing
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Set up Android release signing
        script: |
          cd app
          # Strip any accidental trailing whitespace/newline picked up when
          # the passphrase was copy-pasted into the Codemagic UI.
          TRIMMED_PASSWORD=$(printf '%s' "$CM_KEYSTORE_DECRYPT_PASSWORD" | tr -d '[:space:]')
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in android/release-keystore.enc \
            -out /tmp/kairos-release.keystore -pass "pass:$TRIMMED_PASSWORD"
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/kairos-release.keystore
          EOF
      - name: Build Android App Bundle
        script: |
          cd app
          flutter build appbundle --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - app/build/app/outputs/bundle/release/*.aab
