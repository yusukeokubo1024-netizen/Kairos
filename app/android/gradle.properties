org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
# Tuned down from the Flutter template default (which asks for up to 8G heap
# + 4G metaspace) — this dev machine only has ~5.9G RAM total, so that
# default was killing the Gradle daemon outright.
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
