workflows:
  ios-unsigned-check:
    name: iOS build check (unsigned)
    # No Apple Developer account wired up yet — this just verifies the iOS
    # side actually compiles on a real Mac, since that can't be tested on
    # Windows at all. Once the Apple Developer account + certificates are
    # ready, add code signing (App Store Connect integration) and switch to
    # `flutter build ipa` for a real submittable archive.
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Add GEMINI_API_KEY as an encrypted environment variable in the
        # Codemagic UI (Workflow settings > Environment variables) — never
        # commit it here.
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Re-wire Firebase iOS config into the Xcode project
        script: |
          cd app
          dart pub global activate flutterfire_cli
          dart pub global run flutterfire_cli:flutterfire configure \
            --project=kairos-3d873 \
            --platforms=ios \
            --ios-bundle-id=com.kairos.app.ios \
            --yes
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios
          pod install
      - name: Build iOS (unsigned)
        script: |
          cd app
          flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - app/build/ios/iphoneos/*.app

  android-release:
    name: Android release build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      # The keystore itself is committed (encrypted) at
      # app/android/release-keystore.enc. CM_KEYSTORE_DECRYPT_PASSWORD,
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD live in the
      # "android_signing" variable group in the Codemagic UI — importing
      # the group (not a plain vars self-reference) is what actually
      # exposes them to this workflow.
      groups:
        - android_signing
      vars:
        GEMINI_API_KEY: $GEMINI_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Set up Android release signing
        script: |
          cd app
          # Strip any accidental trailing whitespace/newline picked up when
          # the passphrase was copy-pasted into the Codemagic UI.
          TRIMMED_PASSWORD=$(printf '%s' "$CM_KEYSTORE_DECRYPT_PASSWORD" | tr -d '[:space:]')
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -md sha256 \
            -in android/release-keystore.enc \
            -out /tmp/kairos-release.keystore -pass "pass:$TRIMMED_PASSWORD"
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/kairos-release.keystore
          EOF
      - name: Build Android App Bundle
        script: |
          cd app
          flutter build appbundle --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
    artifacts:
      - app/build/app/outputs/bundle/release/*.aab
